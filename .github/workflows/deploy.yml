name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy al VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/smashiv/Documents/senavi/Server/Backend-Integrador2
            git pull origin main
            sudo systemctl restart senavi_backend
            sleep 3
            sudo systemctl is-active --quiet senavi_backend
